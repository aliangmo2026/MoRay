# ============================================================
# error_fix_flow —— 排错任务模板（p_mcp 迭代·任务2，阶段3.2）
# 四步固定流程（任务书 2.1）+ 经验库前后夹（任务书 5.2）：
#   read_experience → analyze_error → fix_code → verify_in_sandbox
#   → generate_report → record_experience
# 入参 params：
#   project_dir   待修项目根目录（绝对路径）
#   project_id    经验库项目键
#   screenshot    报错截图绝对路径
#   verify_cmd    验证命令（如 python -m py_compile main.py && python main.py）
# 降级声明（偏差 D5）：zcode_call 引擎不可用→llm_patch；docker 不可用→local_exec。
# ============================================================
name: error_fix_flow
version: 1
description: 报错截图 → 分析 → 修复 → 沙箱验证 → 报告 → 经验沉淀 全自动闭环
# [L5.0 阶段3] 串联：全部步骤 ok（含验证通过）后自动续跑 test_run_flow（一张卡、共享预算）。
# 判定见 engine/task_runner.py run() 串联块——verify 失败（continue_on_fail）不会触发。
on_success_next: test_run_flow

defaults:
  retries: 1          # 任务书 3.1：每步失败自动重试 1 次
  timeout: 180

steps:
  - id: read_experience
    type: knowledge_read
    timeout: 20
    args:
      project_id: "{{params.project_id}}"
      top_n: 3

  - id: analyze_error
    type: mcp_call
    timeout: 240      # 视觉 OCR + 诊断两段网关调用
    args:
      tool: iris_analyze_image
      arguments:
        image_path: "{{params.screenshot}}"
        hint: "{{steps.read_experience.output.hint}}"

  - id: fix_code
    type: zcode_call
    timeout: 240
    args:
      project_dir: "{{params.project_dir}}"
      target_file: "{{steps.analyze_error.output.data.file_path}}"
      error_content: "{{steps.analyze_error.output.data.error_content}}"
      hint: "{{steps.read_experience.output.hint}}"
      fallback: llm_patch
      prompt: |
        项目 {{params.project_dir}} 运行报错。错误类型：{{steps.analyze_error.output.data.error_type}}，
        严重度：{{steps.analyze_error.output.data.severity}}，
        涉事文件：{{steps.analyze_error.output.data.file_path}}，行号：{{steps.analyze_error.output.data.line_number}}。
        历史优先假设（经验库）：
        {{steps.read_experience.output.hint}}
        报错原文：
        {{steps.analyze_error.output.data.error_content}}
        请在项目内定位涉事文件，直接修改文件修复该错误；只改与该报错相关的代码，保持其他行为不变。

  - id: verify_in_sandbox
    type: docker_sandbox
    timeout: 120
    continue_on_fail: true   # 验证失败也要出报告并记录经验（success=false）
    args:
      image: python:3.12-slim
      command: "{{params.verify_cmd}}"
      workdir: "{{params.project_dir}}"
      exec_timeout: 60
      fallback: local_exec

  - id: generate_report
    type: report
    timeout: 30
    args:
      path: "{{work_dir}}/fix_report.md"
      content: |
        # MoRay·Iris 排错修复报告 · {{params.project_id}}
        任务：error_fix_flow（工作目录 {{work_dir}}，全流程 {{elapsed_sec}}s）

        ## 1. 报错识别（Iris analyze_error）
        - 错误类型：{{steps.analyze_error.output.data.error_type}}
        - 严重度：{{steps.analyze_error.output.data.severity}}
        - 涉事文件：{{steps.analyze_error.output.data.file_path}}（行 {{steps.analyze_error.output.data.line_number}}）
        - 语言：{{steps.analyze_error.output.data.file_type}}

        ## 2. 根因候选（按优先级）
        {{steps.analyze_error.output.data.root_cause_candidates}}

        ## 3. 经验库优先假设（分析前注入）
        {{steps.read_experience.output.hint}}

        ## 4. 修复
        - 执行引擎：{{steps.fix_code.engine}}
        {{steps.fix_code.output.diff}}
        {{steps.fix_code.output.result}}

        ## 5. 沙箱验证
        - 状态：{{steps.verify_in_sandbox.status}}（引擎 {{steps.verify_in_sandbox.engine}}）
        - exit：{{steps.verify_in_sandbox.output.exit_code}}
        - stdout 尾部：{{steps.verify_in_sandbox.output.stdout}}
        - stderr 尾部：{{steps.verify_in_sandbox.output.stderr}}

        ## 6. 经验沉淀
        - 写入：{{steps.record_experience.status}} → {{steps.record_experience.output.path}}

        —— 由 MoRay 任务模板引擎（engine/task_runner.py）自动生成

  - id: record_experience
    type: knowledge_write
    timeout: 20
    args:
      entry:
        project_id: "{{params.project_id}}"
        error_type: "{{steps.analyze_error.output.data.error_type}}"
        root_cause_category: "{{steps.analyze_error.output.data.root_cause_candidates[0].cause}}"
        error_snippet: "{{steps.analyze_error.output.data.error_content}}"
        solution: "{{steps.fix_code.output.diff}}{{steps.fix_code.output.result}}"
        duration_sec: "{{elapsed_sec}}"
        success: "{{steps.verify_in_sandbox.status}}"
