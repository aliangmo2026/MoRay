<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试卡片</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f2f4f8;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    .card {
      width: 320px;
      padding: 24px;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(20, 30, 60, 0.12);
    }

    .card h1 {
      margin: 0 0 8px;
      font-size: 20px;
      color: #1b2430;
    }

    .card p {
      margin: 0 0 16px;
      font-size: 14px;
      line-height: 1.6;
      color: #5a6675;
    }

    .card button {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: #2f6df6;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
    }

    .card button:hover {
      background: #2559cc;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>测试卡片</h1>
    <p>这是一个用于验证页面渲染的简单卡片组件。</p>
    <button type="button">确认</button>
  </div>
</body>
</html>
